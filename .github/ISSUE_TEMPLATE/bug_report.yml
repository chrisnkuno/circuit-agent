name: Bug report
description: Something in the app behaves incorrectly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not report security problems here — see the private reporting link on the
        previous screen.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what the app did, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a project at ...
        2. Switch to Build mode
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in Settings, or the installer filename.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS (Apple silicon)
        - macOS (Intel)
        - Linux
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or crash report
      description: Anything the app printed. Redact API keys before pasting.
      render: text
