name: Native state release

on:
  push:
    branches:
      - nova-cli-packages
    paths:
      - .github/workflows/native-state-release.yml
      - packages/nova-state/**
      - tooling/release/package-native-state.ts
      - tooling/release/publish-native-state.ts
  workflow_dispatch:
    inputs:
      version:
        description: Synchronized native package version
        required: true
        default: 0.1.0
        type: string
      publish:
        description: Publish packages to npm after every artifact passes verification
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: ${{ matrix.package }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            package: linux-x64-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            package: linux-arm64-gnu
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            package: linux-x64-musl
            musl: true
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            package: linux-arm64-musl
            musl: true
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            package: darwin-x64
          - runner: macos-15
            target: aarch64-apple-darwin
            package: darwin-arm64
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            package: win32-x64
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            package: win32-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/nova-state
          key: ${{ matrix.target }}
      - name: Install musl linker
        if: matrix.musl == true
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Test native engine
        run: cargo test --locked --manifest-path packages/nova-state/Cargo.toml --target ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --locked --release --manifest-path packages/nova-state/Cargo.toml --target ${{ matrix.target }} --bin nova-state
      - name: Smoke-test protocol
        shell: bash
        run: |
          binary="packages/nova-state/target/${{ matrix.target }}/release/nova-state"
          if [[ "$RUNNER_OS" == "Windows" ]]; then binary="${binary}.exe"; fi
          reply=$(echo '{"id":"release","protocolVersion":1,"method":"ping","params":{}}' | "$binary")
          echo "$reply"
          echo "$reply" | grep -q '"readOnlyCanonicalSources":true'
      - name: Stage npm package
        shell: bash
        run: |
          binary="packages/nova-state/target/${{ matrix.target }}/release/nova-state"
          if [[ "$RUNNER_OS" == "Windows" ]]; then binary="${binary}.exe"; fi
          bun run tooling/release/package-native-state.ts --target "${{ matrix.target }}" --version "${{ inputs.version || '0.1.0' }}" --binary "$binary" --out-dir release-packages
          npm pack --dry-run "./release-packages/${{ matrix.package }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: release-packages/${{ matrix.package }}
          if-no-files-found: error

  release:
    name: Verify and publish native packages
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/download-artifact@v8
        with:
          path: release-packages
      - name: Verify synchronized package set
        run: bun run tooling/release/publish-native-state.ts --packages-dir release-packages --version "${{ inputs.version || '0.1.0' }}"
      - name: Publish native packages
        if: inputs.publish == true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun run tooling/release/publish-native-state.ts --packages-dir release-packages --version "${{ inputs.version || '0.1.0' }}" --publish --provenance
