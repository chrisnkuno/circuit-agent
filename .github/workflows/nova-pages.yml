name: Nova spectator Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nova-pages.yml"
      - "reliability/latest.json"
      - "reliability/catalog.json"
      - "reliability/site/**"
      - "scripts/reliability-publish.ts"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nova-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Build sanitized public evidence
        run: bun run scripts/reliability-publish.ts
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: reliability/site
      - name: Deploy spectator UI
        id: deployment
        uses: actions/deploy-pages@v4
