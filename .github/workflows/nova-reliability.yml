name: Nova scheduled reliability

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nova-reliability
  cancel-in-progress: false

jobs:
  platform-audit:
    name: ${{ matrix.os }} controls
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            runner: ubuntu-latest
          - os: macOS
            runner: macos-latest
          - os: Windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build:packages
      - run: bun run reliability:audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nova-audit-${{ matrix.os }}
          path: reliability/audits/*.json

  benchmark:
    needs: platform-audit
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment:
      name: github-pages
    env:
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      # Run journeys back-to-back. Provider retries already protect transient
      # failures, and the previous two-minute gap added 30 minutes to this pool.
      NOVA_RELIABILITY_SPACING_MS: 0
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build:packages
      - uses: actions/download-artifact@v8
        with:
          pattern: nova-audit-*
          path: reliability/audits
          merge-multiple: true
      - name: Measure Exa research quality and alpha discovery
        run: |
          if [[ -n "$EXA_API_KEY" ]]; then
            set +e
            bun run reliability:exa
            exa_exit=$?
            set -e
            if [[ $exa_exit -ne 0 ]]; then
              bun run tooling/reliability/reliability-record-error.ts exa-research scheduled "$exa_exit"
              echo "::error::Exa research evaluation failed; sanitized evidence was retained"
            fi
          else
            echo "::warning::EXA_API_KEY is absent; Exa quality remains unmeasured"
          fi
      - name: Score platform and Exa evidence without paid providers
        run: |
          echo "Paid CircuitNotion journeys are intentionally disabled; scoring the free-model and platform evidence"
          bun run reliability:rescore
      - name: Test the H2 2026 free agentic pool
        env:
          OPENAI_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_BASE_URL: https://openrouter.ai/api/v1
          NOVA_RELIABILITY_PROVIDER: openai
        run: |
          if [[ -z "$OPENAI_API_KEY" ]]; then echo "OPENROUTER_API_KEY repository secret is required"; exit 1; fi
          set +e
          echo "::group::North Mini Code reliability journeys"
          NOVA_RELIABILITY_MODEL='cohere/north-mini-code:free' NOVA_RELIABILITY_REPORT='reports/north-mini-code.json' bun run reliability:scheduled
          north_exit=$?
          echo "::endgroup::"
          if [[ $north_exit -ne 0 ]]; then bun run tooling/reliability/reliability-record-error.ts free-model 'cohere/north-mini-code:free' "$north_exit"; fi
          echo "::group::Nemotron 3.5 Lightning reliability journeys"
          NOVA_RELIABILITY_MODEL='nvidia/nemotron-3.5-lightning:free' NOVA_RELIABILITY_REPORT='reports/nemotron-3.5-lightning.json' bun run reliability:scheduled
          lightning_exit=$?
          echo "::endgroup::"
          if [[ $lightning_exit -ne 0 ]]; then bun run tooling/reliability/reliability-record-error.ts free-model 'nvidia/nemotron-3.5-lightning:free' "$lightning_exit"; fi
          exit 0
      - name: Promote the strongest fully passing free model
        run: bun run reliability:promote
      - name: Build public spectator data
        run: bun run reliability:publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nova-reliability-${{ github.run_id }}
          path: |
            reliability/latest.json
            reliability/reports/*.json
            reliability/audits/*.json
            reliability/exa/latest.json
            reliability/errors.json
            reliability/site/runs/**
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: reliability/site
      - name: Deploy spectator UI
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Publish latest evidence to README
        if: success()
        run: |
          if git diff --quiet -- README.md reliability/latest.json; then exit 0; fi
          git config user.name "nova-reliability[bot]"
          git config user.email "nova-reliability[bot]@users.noreply.github.com"
          git add README.md reliability/latest.json
          git commit -m "chore: refresh Nova reliability score"
          # A release or another reliability run may update main while the
          # benchmark is running. Replay this small evidence commit first so a
          # non-fast-forward race does not turn a successful run red.
          git pull --rebase --autostash origin main
          git push
