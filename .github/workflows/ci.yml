# Every check that has to pass before a change lands.
#
# The properties worth proving on every push are that the window still compiles against its shell,
# that the suite is green, and that the artifact an installer would embed is a real self-contained
# executable rather than a wrapper script — that last one is how a sidecar named `.cmd` where Tauri
# looks for `.exe` once survived for months.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    name: App and sidecar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Tests
        run: bun run test

      - name: Typecheck the window and the sidecar
        run: bun run typecheck

      - name: Build the frontend
        run: bun run build

      # Cross-compiled from Linux, which is the whole reason `bun build --compile` is used here
      # rather than Node's SEA: producing the Windows artifact does not need a Windows host.
      - name: Compile the sidecar for Linux and Windows
        run: bun run sidecar:binary -- x86_64-unknown-linux-gnu x86_64-pc-windows-msvc

      - name: The Windows sidecar must be a real PE executable, not a wrapper
        run: |
          exe="src-tauri/binaries/nova-sidecar-x86_64-pc-windows-msvc.exe"
          test -f "$exe" || { echo "::error::$exe was not produced — a Windows build would not find its sidecar"; exit 1; }
          file "$exe" | grep -q "PE32+ executable" || { echo "::error::$exe is not a Windows executable"; exit 1; }
          # A shell wrapper is a few hundred bytes; an embedded runtime is tens of megabytes.
          size=$(stat -c%s "$exe")
          test "$size" -gt 20000000 || { echo "::error::$exe is only $size bytes — too small to be self-contained"; exit 1; }
          echo "Windows sidecar: $(( size / 1024 / 1024 )) MB, self-contained"

      - name: The Linux sidecar must actually speak the protocol
        run: |
          reply=$(echo '{"id":"1","type":"ping"}' | ./src-tauri/binaries/nova-sidecar-x86_64-unknown-linux-gnu | head -2)
          echo "$reply"
          echo "$reply" | grep -q '"pong":true' || { echo "::error::the compiled sidecar did not answer a ping"; exit 1; }

  shell:
    name: Rust shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile

      - name: Compile the sidecar resource Clippy validates
        run: bun run sidecar:binary -- x86_64-unknown-linux-gnu

      - name: Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev libssl-dev libdbus-1-dev pkg-config

      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Lints
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
