name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  native-state:
    name: Native state · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/nova-state
      - run: bun install --frozen-lockfile
      - name: Format
        run: cargo fmt --manifest-path packages/nova-state/Cargo.toml -- --check
      - name: Invariants and behavioral tests
        run: cargo test --locked --manifest-path packages/nova-state/Cargo.toml
      - name: Lints
        run: cargo clippy --locked --manifest-path packages/nova-state/Cargo.toml --all-targets -- -D warnings
      - name: Build release sidecar
        run: cargo build --locked --release --manifest-path packages/nova-state/Cargo.toml --bin nova-state
      - name: Protocol smoke test
        shell: bash
        run: |
          binary="packages/nova-state/target/release/nova-state"
          if [[ "$RUNNER_OS" == "Windows" ]]; then binary="${binary}.exe"; fi
          reply=$(echo '{"id":"ci","protocolVersion":1,"method":"ping","params":{}}' | "$binary")
          echo "$reply"
          echo "$reply" | grep -q '"readOnlyCanonicalSources":true'
          echo "$reply" | grep -q '"brain.search"'
      - name: CLI native-history and fallback smoke test
        shell: bash
        run: |
          bun run build:packages
          binary="$PWD/packages/nova-state/target/release/nova-state"
          if [[ "$RUNNER_OS" == "Windows" ]]; then binary="${binary}.exe"; fi
          smoke_root="$RUNNER_TEMP/nova-state-cli-smoke"
          mkdir -p "$smoke_root"
          node --input-type=module -e 'import { saveSession } from "./packages/agent-core/dist/nova-cli/session.js"; const root = process.argv[1]; await saveSession({ schemaVersion: 2, revision: 0, id: "20260814T120000Z-ci1234", createdAt: Date.now(), updatedAt: Date.now(), root, title: "Native history smoke", messages: [{ role: "user", content: "Find the PaymentIntent retry regression" }, { role: "assistant", content: "Verified the retry behavior" }], approvals: {}, totalRwf: 0 });' "$smoke_root"
          native_output=$(NOVA_STATE_BINARY="$binary" node packages/nova-cli/dist/nova.mjs history search PaymentIntent retry --cwd "$smoke_root")
          echo "$native_output"
          echo "$native_output" | grep -q 'snapshot evidence'
          fallback_output=$(NOVA_STATE_BINARY="$RUNNER_TEMP/missing-nova-state" node packages/nova-cli/dist/nova.mjs history search PaymentIntent retry --cwd "$smoke_root")
          echo "$fallback_output"
          echo "$fallback_output" | grep -q '1 match'
          brain_data="$RUNNER_TEMP/nova-defender-brain"
          brain_reply=$(echo "{\"id\":\"brain\",\"protocolVersion\":1,\"method\":\"brain.rebuild\",\"params\":{\"sourceRoot\":\"$PWD/packages/nova-state/defender-knowledge\",\"dataRoot\":\"$brain_data\"}}" | "$binary")
          echo "$brain_reply"
          echo "$brain_reply" | grep -Eq '"records":[1-9][0-9]*'
          echo "$brain_reply" | grep -q '"rejected":0'
      - name: Record portable benchmark
        shell: bash
        run: |
          cargo run --locked --release --features benchmark --manifest-path packages/nova-state/Cargo.toml --bin nova-state-bench -- --sessions 100 --messages 20 --queries 50 > nova-state-benchmark.json
          cargo run --locked --release --features benchmark --manifest-path packages/nova-state/Cargo.toml --bin nova-defender-brain-bench -- --records 10000 --queries 2000 > nova-defender-brain-benchmark.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nova-state-benchmark-${{ matrix.os }}
          path: |
            nova-state-benchmark.json
            nova-defender-brain-benchmark.txt

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - run: bun run test:coverage

      - run: bun run typecheck

      # Convex generated bindings are committed, so the build only needs
      # placeholder values for the client env vars it reads at build time.
      # No real Convex deployment or provider credentials are contacted.
      - name: Write placeholder build env
        run: |
          cat > .env.local <<'EOF'
          CONVEX_DEPLOYMENT=dev:placeholder
          NEXT_PUBLIC_CONVEX_URL=https://placeholder.convex.cloud
          NEXT_PUBLIC_CONVEX_SITE_URL=https://placeholder.convex.site
          NEXT_PUBLIC_SITE_URL=http://localhost:3000
          EOF

      - run: bun run build

      # Playwright e2e is intentionally not run here: the e2e suite exercises
      # a real Convex deployment (auth sign-up, task persistence), which this
      # workflow has no credentials for. Run `bun run test:e2e` locally against
      # a configured dev deployment before merging changes that touch the
      # workspace UI or Convex mutations it calls.

  cli-portability:
    name: CLI · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Test CLI and core portability
        run: bun run test -- packages/nova-cli packages/agent-core/src/nova-cli

      - run: bun run build:packages

      # The bundle is ESM and named .mjs, which is also what package.json `bin` points at. This
      # step asserted `dist/nova.js` — a file the build has never produced — so the one check that
      # proves the published binary actually starts was failing on every run of this job.
      - name: Smoke-test the Node executable
        run: node packages/nova-cli/dist/nova.mjs --help

      - name: Verify publish contents
        working-directory: packages/nova-cli
        run: npm pack --dry-run

  # Nothing here ran in CI before, which is how a sidecar named `.cmd` where Tauri looks for `.exe`
  # survived: every check was a developer remembering to run it. The two properties worth proving on
  # every push are that the app still compiles against its shell, and that the artifact an installer
  # would embed is a real self-contained executable rather than a wrapper script.
  desktop:
    name: Desktop app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      # The sidecar imports @circuit-nova/nova-core through its published `exports` map, which
      # points at dist. Compiling before that exists fails on a missing module.
      - run: bun run build:packages

      - name: Typecheck the UI and the sidecar
        working-directory: apps/nova-desktop
        run: bun run typecheck

      - name: Build the frontend
        working-directory: apps/nova-desktop
        run: bun run build

      # Cross-compiled from Linux, which is the whole reason `bun build --compile` is used here
      # rather than Node's SEA: producing the Windows artifact does not need a Windows host.
      - name: Compile the sidecar for Linux and Windows
        working-directory: apps/nova-desktop
        run: bun run sidecar:binary -- x86_64-unknown-linux-gnu x86_64-pc-windows-msvc

      - name: The Windows sidecar must be a real PE executable, not a wrapper
        working-directory: apps/nova-desktop
        run: |
          exe="src-tauri/binaries/nova-sidecar-x86_64-pc-windows-msvc.exe"
          test -f "$exe" || { echo "::error::$exe was not produced — a Windows build would not find its sidecar"; exit 1; }
          file "$exe" | grep -q "PE32+ executable" || { echo "::error::$exe is not a Windows executable"; exit 1; }
          # A shell wrapper is a few hundred bytes; an embedded runtime is tens of megabytes. This
          # is the check that would have caught the `.cmd` that shipped for months.
          size=$(stat -c%s "$exe")
          test "$size" -gt 20000000 || { echo "::error::$exe is only $size bytes — too small to be self-contained"; exit 1; }
          echo "Windows sidecar: $(( size / 1024 / 1024 )) MB, self-contained"

      - name: The Linux sidecar must actually speak the protocol
        working-directory: apps/nova-desktop
        run: |
          reply=$(echo '{"id":"1","type":"ping"}' | ./src-tauri/binaries/nova-sidecar-x86_64-unknown-linux-gnu | head -2)
          echo "$reply"
          echo "$reply" | grep -q '"pong":true' || { echo "::error::the compiled sidecar did not answer a ping"; exit 1; }

      - name: Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev libssl-dev libdbus-1-dev pkg-config

      # Compiles the Rust shell, which is what resolves `externalBin` and therefore what fails when
      # the sidecar is missing or misnamed.
      - name: Compile the Tauri shell
        working-directory: apps/nova-desktop/src-tauri
        run: cargo build --locked

  # The installer itself, on the platform the app targets. Slower than the checks above and split
  # out for that reason: Tauri cannot cross-compile MSI or NSIS, so this is the only place a real
  # Windows artifact can be produced and kept.
  desktop-windows-installer:
    name: Desktop installer · Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - run: bun run build:packages

      - name: Build the installers
        working-directory: apps/nova-desktop
        run: bun run package:windows

      - uses: actions/upload-artifact@v4
        with:
          name: nova-desktop-windows
          path: apps/nova-desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/
          if-no-files-found: error
