name: Nova Desktop Windows

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/nova-desktop/**"
      - ".github/workflows/nova-desktop-windows.yml"

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/nova-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # From the repository root, with bun: the app's `workspace:*` dependency on nova-core is not
      # something npm can resolve. See the same step in release-desktop.yml.
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
        working-directory: .

      # See release-desktop.yml: nova-core's types live in a gitignored dist.
      - name: Build workspace packages
        run: bun run build:packages
        working-directory: .
      - name: Build Windows sidecar
        run: npm run sidecar:binary -- x86_64-pc-windows-msvc
      - name: Build Tauri (NSIS + MSI)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/nova-desktop
          tauriScript: npm run tauri
          args: --target x86_64-pc-windows-msvc
          tagName: nova-desktop-v__VERSION__
          releaseName: "Nova Desktop v__VERSION__"
          releaseDraft: true
          includeUpdaterJson: false
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nova-windows
          path: |
            apps/nova-desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            apps/nova-desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            apps/nova-desktop/src-tauri/target/x86_64-pc-windows-msvc/release/nova-desktop.exe
          if-no-files-found: warn
