name: Release Desktop

# Builds the Nova desktop installers (self-contained — no Node needed on the user's machine) on a
# v* tag and publishes them to GitHub Releases, together with the signed `latest.json` the app's
# auto-updater checks against.
#
# Three artifacts, from three jobs writing into the same release:
#   Windows x64   — NSIS installer + MSI
#   macOS arm64   — .dmg for Apple silicon
#   macOS x64     — .dmg for Intel
#
# macOS is built as two per-architecture bundles rather than one universal binary, because the
# sidecar is an `externalBin` that Tauri resolves by target triple: a universal app would need a
# universal sidecar, and two honest single-arch downloads beat one that is subtly wrong on half the
# machines it lands on.
#
# To release a new version:
#   1. Bump `version` in apps/nova-desktop/src-tauri/tauri.conf.json AND
#      apps/nova-desktop/package.json (and src-tauri/Cargo.toml).
#   2. Push a tag matching the version: `git tag v0.2.0 && git push origin v0.2.0`
#
# Actions are pinned to commit SHAs rather than floating tags: they run with the signing secrets in
# scope, and a moved tag would silently change what code that is.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY          — from `npm run tauri signer generate`
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD — optional password (unset if none)
# The matching public key is baked into apps/nova-desktop/src-tauri/tauri.conf.json.
#
# Optional, for a macOS build users can open without right-click → Open. Without all of these the
# .dmg still builds and still runs, but it is unsigned and Gatekeeper will warn on first launch:
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      # One platform failing must not delete the artifacts the others already uploaded to the
      # release — a half-published release is recoverable, a cancelled one loses the successes.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            label: Windows x64
          - os: macos-latest
            triple: aarch64-apple-darwin
            label: macOS (Apple silicon)
          - os: macos-latest
            triple: x86_64-apple-darwin
            label: macOS (Intel)

    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check tag matches app version
        shell: bash
        run: |
          APP_VERSION=$(node -p "require('./apps/nova-desktop/src-tauri/tauri.conf.json').version")
          echo "App version: $APP_VERSION"
          echo "Pushed tag:  ${{ github.ref_name }}"
          [[ "${{ github.ref_name }}" == "v$APP_VERSION" ]] || {
            echo "::error::Tag must match the app version (v$APP_VERSION). Bump the version in apps/nova-desktop first."
            exit 1
          }

      - name: Setup bun (for the self-contained sidecar)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.triple }}

      # Installed from the repository root with bun, not with npm inside the app: the desktop
      # depends on `@circuit-nova/nova-core` as `workspace:*`, a protocol npm does not understand
      # ("Unsupported URL Type") — so `npm install` here failed every platform of this workflow the
      # moment the app started sharing code with the CLI.
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      # nova-core is consumed through its built `dist` — that is what its `exports` map points at
      # for both types and code — and `dist/` is gitignored, so a fresh checkout has neither. The
      # desktop's own `tsc -b` therefore fails on every one of its nova-core imports until this
      # runs. Locally it is invisible: anyone who has built the packages once never sees it again.
      - name: Build workspace packages
        run: bun run build:packages

      - name: Build and publish to GitHub Releases
        uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # The runner's own architecture is not the answer when building the Intel bundle on an
          # Apple-silicon runner: `rustc --print host-tuple` would say aarch64 and the sidecar would
          # be built for the wrong machine. Naming the target is what keeps the two in step.
          NOVA_SIDECAR_TARGET: ${{ matrix.triple }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/nova-desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Nova ${{ github.ref_name }}"
          releaseBody: |
            Nova Desktop — self-contained, no Node required.

            - **Windows**: `Nova_${{ github.ref_name }}_x64-setup.exe` (NSIS) or the `.msi`
            - **macOS (Apple silicon)**: `Nova_${{ github.ref_name }}_aarch64.dmg`
            - **macOS (Intel)**: `Nova_${{ github.ref_name }}_x64.dmg`

            Auto-updates: installed apps will update themselves from this release.

            If macOS reports the app cannot be opened because the developer cannot be verified,
            the build is unsigned — right-click the app and choose Open to run it once.
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.triple }}
          updaterJsonPreferNsis: true
