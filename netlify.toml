# Netlify deployment for Circuit-Nova (Next.js 16 + Bun).
#
# Netlify auto-detects Next.js and applies @netlify/plugin-nextjs, which
# handles the .next output, API routes, and middleware — so there is no
# publish directory to set here.
#
# Required environment variables (set in Netlify → Site settings → Env vars):
#   NEXT_PUBLIC_SITE_URL        https://<your-site>.netlify.app
#   NEXT_PUBLIC_CONVEX_URL      real Convex deployment URL (see below)
#   NEXT_PUBLIC_CONVEX_SITE_URL real Convex site URL
#   SITE_ACCESS_PASSWORD        optional basic-auth gate (unset = open preview)
#
# NOTE: the local .env.local ships placeholder Convex URLs for CI. A deployed
# preview will render the landing page but live features (tasks, terminal,
# auth) will fail until real Convex env vars are set here. Deploy Convex once
# from your machine: `bunx convex deploy`, then copy the URLs it prints.

# MONOREPO NOTE — this file lives at the workspace root, but the site is `apps/web`.
#
# `bun run build` here delegates to that workspace, so the command is correct as written; what
# Netlify cannot infer is where the build *output* lands. Set the package directory to `apps/web`
# in Site settings -> Build & deploy -> Package directory, or @netlify/plugin-nextjs will look for
# `.next` at the root and find nothing.
#
# The install still has to happen at the root: `apps/web` depends on `@circuit-nova/nova-core` as
# a workspace, which only resolves from the workspace root's lockfile.

[build]
  command = "bun run build"

[build.environment]
  BUN_VERSION = "1.3.14"
