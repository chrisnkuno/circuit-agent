<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nova</title>
    <!--
      No remote fonts. This is a desktop app: a stylesheet fetched from fonts.googleapis.com means
      the typeface silently disappears offline, every launch waits on a third-party host before it
      can paint text, and the app phones out to load its own chrome. The stack in styles.css uses
      each platform's own UI face instead, which is both always available and what a native window
      is expected to look like.
    -->
    <!--
      The theme, before the first paint.
      A stylesheet cannot read a stored preference, and JavaScript that runs after the bundle loads
      runs one paint too late — that paint is the white flash a dark-mode user sees at every launch,
      and it is the clearest tell that a desktop window is a web page. Eleven lines here, running
      synchronously in the head, remove it. `src/lib/theme.ts` is the authority on the rules; this is
      deliberately the smallest possible restatement of them, and `bootTheme()` re-applies the same
      answer on start-up so a divergence corrects itself rather than persisting.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("nova.theme");
          var choice = stored === "light" || stored === "dark" ? stored : "system";
          var resolved = choice === "system"
            ? (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
            : choice;
          document.documentElement.setAttribute("data-theme", resolved);
          document.documentElement.style.colorScheme = resolved;
        } catch (error) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
